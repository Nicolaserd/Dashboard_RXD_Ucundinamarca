# Decisión explícita sobre scripts de build de dependencias (pnpm).
# false = no ejecutar sus scripts nativos. No se usan:
#   - sharp: solo lo requiere la optimización de next/image (no se usa; el
#     logo se sirve con <img> según la regla visual §2.6).
#   - unrs-resolver: binding nativo opcional del resolutor de ESLint.
allowBuilds:
  sharp: false
  unrs-resolver: false
